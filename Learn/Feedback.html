<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Feedback.css">
    <title>Feedback Form</title>
</head>
<body>
    <h1>Feedback Form</h1>
    <form action="post" >
        <label for="name" >Name</label><br>
        <input type="text" id="name" name="name" , placeholder="Ex: Ayush Kumar " ><br>
        <label for="email">Email</label><br>
        <input type="varchar" name="email" , placeholder="Ex: xyz@gmail.com " ><br>
        <lable for="contact number" >Contact Number</lable><br>
        <input type="digit" id="contact number" col="1" row="10" , placeholder="Ex: +91..........(optional)"><br>
        <label for="feedback">Feedback</label><br>
        <textarea name="feedback" id="feedback" cols="30" rows="10" , placeholder="Write your feedback here..."></textarea><br><br>
        <button type="submit" value="Submit Feedback" href="Submit">Submit Feedback</button>
    </form>
</body>
</html>
